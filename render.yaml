services:
- type: web
  name: ballari-urban-flood-api
  runtime: python
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  envVars:
  - key: PYTHON_VERSION
    value: 3.14.4
  - key: FRONTEND_ORIGINS
    value: http://localhost:5173,http://127.0.0.1:5173,https://ballari-urban-flood-digital-twin.vercel.app
